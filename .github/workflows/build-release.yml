name: Build ADR Workspace release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted build input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-input-v0.1.0 --pattern build-input-secure.7z

      - name: Decrypt build input
        shell: pwsh
        env:
          BUILD_ARCHIVE_PASSWORD: ${{ secrets.BUILD_ARCHIVE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path app | Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" x build-input-secure.7z "-p$env:BUILD_ARCHIVE_PASSWORD" -oapp -y
          if ($LASTEXITCODE -ne 0) {
            throw "Could not decrypt build input"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packaging dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify release files
        shell: pwsh
        run: |
          $required = @(
            "app/release/ADR-Workspace-Setup-0.1.0.exe",
            "app/release/ADR-Workspace-Setup-0.1.0.exe.blockmap",
            "app/release/latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing release file: $file"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: adr-workspace-windows-v0.1.0
          path: |
            app/release/ADR-Workspace-Setup-0.1.0.exe
            app/release/ADR-Workspace-Setup-0.1.0.exe.blockmap
            app/release/latest.yml

      - name: Publish public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 `
            app/release/ADR-Workspace-Setup-0.1.0.exe `
            app/release/ADR-Workspace-Setup-0.1.0.exe.blockmap `
            app/release/latest.yml `
            --title "ADR Workspace v0.1.0" `
            --notes "Primeira versão pública do ADR Workspace com atualização automática, cofre local, bloqueio de anúncios e sessões persistentes."
